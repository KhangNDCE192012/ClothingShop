spring.application.name=SBA301_Clothing_Shop

# SQL Server datasource
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ClothingShopDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT authentication (override JWT_SECRET in production)
app.jwt.secret=${JWT_SECRET:Y2xvdGhpbmctc2hvcC1qd3Qtc2VjcmV0LWtleS0yMDI2LXNlY3VyZQ==}
app.jwt.expiration-ms=86400000
